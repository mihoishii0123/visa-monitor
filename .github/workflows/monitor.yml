name: Tokyo Visa Monitor

on:
  workflow_dispatch:
  schedule:
    # 毎時3分：稼働通知あり
    - cron: "3 * * * *"

    # それ以外は約5分間隔
    - cron: "8,13,18,23,28,33,38,43,48,53,58 * * * *"
permissions:
  contents: write

concurrency:
  group: tokyo-visa-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check Tokyo availability
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python monitor.py

      - name: Upload log and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visa-monitor-${{ github.run_number }}
          path: |
            monitor.log
            tokyo-status.png
            state.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Save status only when changed
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json 2>/dev/null)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update visa monitor status" || exit 0
            git pull --rebase origin main
            git push origin main
          fi
