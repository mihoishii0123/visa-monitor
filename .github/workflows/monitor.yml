name: Tokyo Visa Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
    - cron: "10,20,30,40,50 * * * *"

permissions:
  contents: write

concurrency:
  group: tokyo-visa-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check Tokyo availability
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python monitor.py

      - name: Upload log and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visa-monitor-${{ github.run_number }}
          path: |
            monitor.log
            tokyo-status.png
            state.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Save status change
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json 2>/dev/null)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update visa monitor status" || true
            git push
          fi
